name: Prebuilt goose image
description: >
  Restore the goose binary image from the Actions cache, compiling it from
  source only on a miss. The output is a local image reference to hand to
  agent-base's GOOSE_IMAGE build arg, which skips the compile.

outputs:
  image:
    description: Local image reference holding /usr/local/bin/goose.
    value: ${{ steps.key.outputs.image }}

runs:
  using: composite
  steps:
    - name: Derive the cache key
      id: key
      shell: bash
      run: |
        key=$(bash images/agent-base/patches/cache-key.sh)
        echo "cache-key=goose-dist-${RUNNER_OS}-${RUNNER_ARCH}-${key}" >> "$GITHUB_OUTPUT"
        echo "image=localhost/goose-dist:${key}" >> "$GITHUB_OUTPUT"

    # restore + save rather than actions/cache, which only saves from a post
    # step gated on post-if: success(). A cold run that compiles for 35 minutes
    # and then fails its e2e assertion, gets cancelled, or hits the job timeout
    # would save nothing and leave the next run to compile again -- which is
    # the exact loop this cache exists to break. Bank the tar once it exists.
    - name: Restore the goose image
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/goose-dist.tar
        key: ${{ steps.key.outputs.cache-key }}

    # konveyor/ci/build-image upgrades crun before every build it runs, for
    # containers/crun#1485: a podman that emits OCI spec v1.2.1 against a crun
    # too old to parse it, which fails every RUN step. This action's compile
    # happens before that step, so it has to answer the question itself. The
    # e2e job builds agent-base on ubuntu-latest with no upgrade at all and
    # passes, so amd64 is fine; ubuntu-24.04-arm has no such evidence either
    # way. Install only when the runner's own crun is older than the version
    # konveyor/ci pins, so this does nothing on a runner that has caught up
    # and can be deleted outright once both have.
    - name: Ensure crun can run the build
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        CRUN_MIN: "1.28"
      run: |
        have=$(crun --version 2>/dev/null | head -1 | awk '{print $3}')
        if [ -n "${have}" ] && [ "$(printf '%s\n%s\n' "${CRUN_MIN}" "${have}" \
            | sort -V | head -1)" = "${CRUN_MIN}" ]; then
          echo "crun ${have} is new enough, leaving it alone"
          exit 0
        fi
        echo "crun is ${have:-absent}, installing ${CRUN_MIN}"
        arch=$(uname -m)
        case "${arch}" in
          x86_64)  arch=amd64 ;;
          aarch64) arch=arm64 ;;
        esac
        curl -sfLo /tmp/crun --retry 5 --retry-delay 10 --retry-all-errors \
          "https://github.com/containers/crun/releases/download/${CRUN_MIN}/crun-${CRUN_MIN}-linux-${arch}"
        chmod +x /tmp/crun
        /tmp/crun --version | head -1 | grep -q "crun version ${CRUN_MIN}"
        sudo mv /tmp/crun /usr/bin/crun

    # On a cache miss the compile needs the submodule's actual contents. If the
    # calling workflow checked out without submodules the directory is empty,
    # COPY silently copies nothing, and the first thing to notice is git apply
    # reporting "crates/goose/Cargo.toml: No such file or directory" a couple
    # of minutes into the container build. Say what is actually wrong instead.
    - name: Check the goose submodule is populated
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ ! -f images/agent-base/goose-src/Cargo.toml ]; then
          echo "images/agent-base/goose-src is empty, so goose cannot be compiled."
          echo "Add 'submodules: true' to this job's actions/checkout step."
          exit 1
        fi

    - name: Compile goose
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GOOSE_DIST_IMG: ${{ steps.key.outputs.image }}
      run: |
        make goose-dist-build CONTAINER_TOOL=podman GOOSE_DIST_IMG="${GOOSE_DIST_IMG}"
        podman save --format=docker-archive -o /tmp/goose-dist.tar "${GOOSE_DIST_IMG}"

    - name: Save the goose image
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/goose-dist.tar
        key: ${{ steps.key.outputs.cache-key }}

    - name: Load the goose image
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        GOOSE_DIST_IMG: ${{ steps.key.outputs.image }}
      run: |
        podman load -i /tmp/goose-dist.tar
        # load restores whatever RepoTags the archive carries. If that is not
        # the tag the build is about to name, the failure otherwise surfaces
        # half an hour later as an unresolvable FROM inside agent-base.
        podman image exists "${GOOSE_DIST_IMG}"
